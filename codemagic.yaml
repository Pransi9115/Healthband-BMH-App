workflows:

  # ─────────────────────────────────────────────────────────
  # iOS — build and upload to TestFlight
  # ─────────────────────────────────────────────────────────
  ios-workflow:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      groups:
        - appstore_credentials      # AUTH_KEY, APP_STORE_KEY_ID, APP_STORE_ISSUER_ID
      vars:
        BUNDLE_ID: "com.biohealthcare.bmhapp"
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      flutter: stable
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:

      - name: Set up code signing
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --platform IOS \
            --issuer-id "$APP_STORE_ISSUER_ID" \
            --key-id "$APP_STORE_KEY_ID" \
            --private-key "$AUTH_KEY" \
            --create
          keychain initialize
          keychain add-certificates
      
      - name: Archive and export IPA
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

      - name: Install dependencies
        script: |
          flutter pub get
          find . -name "Podfile" -execdir pod install \;

      - name: Set build number from TestFlight
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number \
            --bundle-id "$BUNDLE_ID" \
            --issuer-id "$APP_STORE_ISSUER_ID" \
            --key-id "$APP_STORE_KEY_ID" \
            --private-key "$AUTH_KEY" 2>/dev/null || echo "0")
          echo "Latest TestFlight build: $LATEST"
          echo "BUILD_NUMBER=$(($LATEST + 1))" >> $CM_ENV

      - name: Build Flutter (unsigned)
        script: |
          flutter build ios --release --no-codesign \
            --build-number=$BUILD_NUMBER

      - name: Archive and export IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        api_key: $AUTH_KEY
        key_id: $APP_STORE_KEY_ID
        issuer_id: $APP_STORE_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - pransipatel9115@gmail.com
        notify:
          success: true
          failure: true

  # ─────────────────────────────────────────────────────────
  # Android — build AAB + APKs
  # ─────────────────────────────────────────────────────────
  android-workflow:
    name: Android Release
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      android_signing:
        - bmh_keystore           # configure under Code signing identities
      flutter: stable

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:

      - name: Install dependencies
        script: flutter pub get

      - name: Static analysis
        script: flutter analyze --no-fatal-infos
        ignore_failure: true

      - name: Build AAB and APK
        script: |
          flutter build appbundle --release \
            --build-number=$PROJECT_BUILD_NUMBER
          flutter build apk --release --split-per-abi \
            --build-number=$PROJECT_BUILD_NUMBER

    artifacts:
      - build/**/outputs/bundle/**/*.aab
      - build/**/outputs/flutter-apk/*.apk
      - build/**/outputs/**/mapping.txt

    publishing:
      email:
        recipients:
          - pransipatel9115@gmail.com
        notify:
          success: true
          failure: true
